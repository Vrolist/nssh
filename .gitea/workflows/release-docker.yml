name: Release Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version (e.g., 1.2.3)'
        required: false
        default: ''

env:
  GO_VERSION: "1.24.12"
  GOPROXY: "https://goproxy.cn,direct"
  # Gitea 仓库 Settings → Actions Secrets:
  # HARBOR_REGISTRY, HARBOR_PROJECT, HARBOR_USER, HARBOR_PASSWORD, GTEA_TOKEN
  REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  PROJECT: ${{ secrets.HARBOR_PROJECT }}
  IMAGE_NAME: nssh

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: http://x-access-token:${{ secrets.GTEA_TOKEN }}@192.168.2.27/buladou/checkout@v4

      - name: Setup Go
        run: |
          GO_TARBALL="go${GO_VERSION}.linux-amd64.tar.gz"
          MIRRORS=(
            "http://192.168.2.36/${GO_TARBALL}"
            "https://golang.google.cn/dl/${GO_TARBALL}"
          )
          for MIRROR in "${MIRRORS[@]}"; do
            if curl -fsSL --connect-timeout 30 --max-time 300 "$MIRROR" -o "/tmp/${GO_TARBALL}"; then
              break
            fi
            echo "Mirror failed: $MIRROR"
          done
          if [ -f "/tmp/${GO_TARBALL}" ]; then
            tar -C /usr/local -xzf "/tmp/${GO_TARBALL}"
            echo "/usr/local/go/bin" >> $GITHUB_PATH
            export PATH="/usr/local/go/bin:$PATH"
            go version
            go env -w GOPROXY=${GOPROXY}
          else
            echo "Error: Failed to download Go from all mirrors"
            exit 1
          fi

      - name: Run tests
        run: |
          GOTOOLCHAIN=local go test -C base_core ./...
          GOTOOLCHAIN=local go test -C base_tunnel ./...
          GOTOOLCHAIN=local go test -C daemon ./...

  build-and-push:
    needs: test
    runs-on: go-linux
    timeout-minutes: 30
    env:
      # 局域网直连 Harbor，不走代理（代理 192.168.2.40:7890 已停用）
      # 注意: docker login/push 由宿主 docker daemon 执行，需在 daemon 侧
      # 配置 NO_PROXY（见 /etc/systemd/system/docker.service.d/*.conf），
      # 此处的 env 只对 docker CLI 内联请求（如 buildx imagetools）生效
      NO_PROXY: "${{ secrets.HARBOR_REGISTRY }},192.168.2.88,127.0.0.1,localhost,192.168.2.0/24"
      no_proxy: "${{ secrets.HARBOR_REGISTRY }},192.168.2.88,127.0.0.1,localhost,192.168.2.0/24"

    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 "http://x-access-token:${{ secrets.GTEA_TOKEN }}@192.168.2.27/${GITHUB_REPOSITORY}.git" .
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            git fetch --depth 1 origin tag "${TAG}"
            git checkout "${TAG}"
          fi

      - name: Setup Go
        run: |
          # Ensure curl is available (some self-hosted runners lack it)
          if ! command -v curl >/dev/null 2>&1; then
            echo "curl not found, trying to install..."
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq curl
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache curl
            elif command -v yum >/dev/null 2>&1; then
              yum install -y -q curl
            fi
          fi
          GO_TARBALL="go${GO_VERSION}.linux-amd64.tar.gz"
          MIRRORS=(
            "http://192.168.2.36/${GO_TARBALL}"
            "https://golang.google.cn/dl/${GO_TARBALL}"
          )
          # Prefer curl, fallback to wget
          DOWNLOAD_CMD=""
          command -v curl >/dev/null 2>&1 && DOWNLOAD_CMD="curl -fsSL --connect-timeout 30 --max-time 300 -o"
          command -v wget >/dev/null 2>&1 && DOWNLOAD_CMD="wget -q -T 300 -O"
          if [ -z "$DOWNLOAD_CMD" ]; then
            echo "Error: neither curl nor wget available"
            exit 1
          fi
          for MIRROR in "${MIRRORS[@]}"; do
            echo "Downloading from $MIRROR ..."
            if $DOWNLOAD_CMD "/tmp/${GO_TARBALL}" "$MIRROR"; then
              break
            fi
            echo "Mirror failed: $MIRROR"
          done
          if [ -f "/tmp/${GO_TARBALL}" ]; then
            tar -C /usr/local -xzf "/tmp/${GO_TARBALL}"
            echo "/usr/local/go/bin" >> $GITHUB_PATH
            export PATH="/usr/local/go/bin:$PATH"
            go version
            go env -w GOPROXY=${GOPROXY}
          else
            echo "Error: Failed to download Go from all mirrors"
            exit 1
          fi

      - name: Extract version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev-$(date +%Y%m%d%H%M%S)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Image: ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:${VERSION}"

      # ---- Step 1: Go cross-compile (no QEMU) ----
      - name: Build amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOTOOLCHAIN: local
        run: |
          go build -ldflags="-s -w -X main.Version=${{ env.VERSION }}" \
            -trimpath -o nssh_linux_amd64 .

      - name: Build arm64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOTOOLCHAIN: local
        run: |
          go build -ldflags="-s -w -X main.Version=${{ env.VERSION }}" \
            -trimpath -o nssh_linux_arm64 .

      # ---- Step 2: Prepare rootfs (no QEMU) ----
      # amd64: extract rootfs from native docker container (use local mirror)
      - name: Prepare amd64 rootfs
        run: |
          docker create --name amd64-alpine 192.168.2.88:80/library/alpine:3.18
          mkdir -p build/amd64/rootfs
          docker cp amd64-alpine:/etc build/amd64/rootfs/etc
          docker cp amd64-alpine:/usr build/amd64/rootfs/usr
          docker cp amd64-alpine:/lib build/amd64/rootfs/lib
          docker cp amd64-alpine:/bin build/amd64/rootfs/bin
          docker cp amd64-alpine:/sbin build/amd64/rootfs/sbin
          docker rm amd64-alpine

          # Remove runtime dirs (Docker provides these)
          rm -rf build/amd64/rootfs/etc/{hosts,resolv.conf}
          rm -rf build/amd64/rootfs/dev
          rm -rf build/amd64/rootfs/proc
          rm -rf build/amd64/rootfs/sys

          # Add nssh user
          echo 'nssh:x:1000:1000::/home/nssh:/bin/false' >> build/amd64/rootfs/etc/passwd
          echo 'nssh:x:1000:' >> build/amd64/rootfs/etc/group

          # Application (ensure executable)
          cp nssh_linux_amd64 build/amd64/nssh
          chmod +x build/amd64/nssh
          cp docker/entrypoint.sh build/amd64/
          chmod +x build/amd64/entrypoint.sh
          cp docker/Dockerfile.scratch build/amd64/Dockerfile

      # arm64: download minirootfs tarball (no QEMU, no docker run)
      - name: Prepare arm64 rootfs
        run: |
          mkdir -p build/arm64/rootfs
          # Try China mirrors first (fast on intranet), then official
          ARM64_URLS=(
            "https://mirrors.aliyun.com/alpine/v3.18/releases/aarch64/alpine-minirootfs-3.18.0-aarch64.tar.gz"
            "https://mirrors.tuna.tsinghua.edu.cn/alpine/v3.18/releases/aarch64/alpine-minirootfs-3.18.0-aarch64.tar.gz"
            "https://mirror.sjtu.edu.cn/alpine/v3.18/releases/aarch64/alpine-minirootfs-3.18.0-aarch64.tar.gz"
            "https://mirrors.ustc.edu.cn/alpine/v3.18/releases/aarch64/alpine-minirootfs-3.18.0-aarch64.tar.gz"
            "https://dl-cdn.alpinelinux.org/alpine/v3.18/releases/aarch64/alpine-minirootfs-3.18.0-aarch64.tar.gz"
          )
          DOWNLOADED=false
          for URL in "${ARM64_URLS[@]}"; do
            echo "Trying: $URL"
            if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 180 "$URL" -o /tmp/alpine-arm64.tar.gz \
              && [ -s /tmp/alpine-arm64.tar.gz ] \
              && tar tzf /tmp/alpine-arm64.tar.gz >/dev/null 2>&1; then
              DOWNLOADED=true
              echo "Downloaded from: $URL"
              break
            fi
            rm -f /tmp/alpine-arm64.tar.gz
            echo "Mirror failed: $URL"
          done
          if [ "$DOWNLOADED" != "true" ]; then
            echo "Error: Failed to download arm64 minirootfs from all mirrors"
            exit 1
          fi
          tar xzf /tmp/alpine-arm64.tar.gz -C build/arm64/rootfs

          # Remove runtime dirs (Docker provides these)
          rm -rf build/arm64/rootfs/dev
          rm -rf build/arm64/rootfs/proc
          rm -rf build/arm64/rootfs/sys

          # Add nssh user
          echo 'nssh:x:1000:1000::/home/nssh:/bin/false' >> build/arm64/rootfs/etc/passwd
          echo 'nssh:x:1000:' >> build/arm64/rootfs/etc/group

          # Application (ensure executable)
          cp nssh_linux_arm64 build/arm64/nssh
          chmod +x build/arm64/nssh
          cp docker/entrypoint.sh build/arm64/
          chmod +x build/arm64/entrypoint.sh
          cp docker/Dockerfile.scratch build/arm64/Dockerfile

      # ---- Step 3: Login ----
      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${REGISTRY} \
            -u "${{ secrets.HARBOR_USER }}" --password-stdin

      # ---- Step 4: Build & push (native docker, no buildx/QEMU) ----
      # amd64: native build on amd64 runner (FROM scratch + COPY only)
      - name: Build and push amd64 image
        run: |
          docker build -t ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:amd64 build/amd64/
          docker push ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:amd64

      # arm64: assemble rootfs tarball and docker import with arm64 platform metadata
      - name: Build and push arm64 image
        run: |
          rm -rf /tmp/arm64-img
          mkdir -p /tmp/arm64-img/usr/local/bin
          cp -a build/arm64/rootfs/. /tmp/arm64-img/
          cp build/arm64/nssh /tmp/arm64-img/usr/local/bin/nssh
          cp build/arm64/entrypoint.sh /tmp/arm64-img/entrypoint.sh
          chmod +x /tmp/arm64-img/usr/local/bin/nssh /tmp/arm64-img/entrypoint.sh
          tar -C /tmp/arm64-img -cf /tmp/arm64-rootfs.tar .
          docker import \
            --platform linux/arm64 \
            --change 'USER nssh' \
            --change 'WORKDIR /tmp' \
            --change 'ENTRYPOINT ["/entrypoint.sh"]' \
            /tmp/arm64-rootfs.tar \
            ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:arm64
          docker push ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:arm64

      # ---- Step 5: Merge into multi-arch manifest ----
      # imagetools create 直接读取已 push 的镜像 manifest 合并为 OCI index，
      # 不依赖 buildkit 容器（无外网也能用），与 GitHub 版保持一致
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:${{ env.VERSION }} \
            ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:amd64 \
            ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:arm64
          echo "Pushed ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:${{ env.VERSION }} (amd64+arm64)"

      # ---- Done ----
      - name: Summary
        run: |
          echo "Docker multi-arch image pushed:"
          echo "  ${REGISTRY}/${PROJECT}/${IMAGE_NAME}:${{ env.VERSION }} (amd64+arm64)"
