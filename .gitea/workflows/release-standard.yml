name: Release Standard Platforms

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: "1.24.12"
  GOPROXY: "https://goproxy.cn,direct"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: http://x-access-token:${{ secrets.GTEA_TOKEN }}@192.168.2.27/buladou/checkout@v4

      - name: Setup Go
        run: |
          # Ensure curl is available (some self-hosted runners lack it)
          if ! command -v curl >/dev/null 2>&1; then
            echo "curl not found, trying to install..."
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq curl
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache curl
            elif command -v yum >/dev/null 2>&1; then
              yum install -y -q curl
            fi
          fi
          GO_TARBALL="go${GO_VERSION}.linux-amd64.tar.gz"
          MIRRORS=(
            "http://192.168.2.36/${GO_TARBALL}"
            "https://golang.google.cn/dl/${GO_TARBALL}"
          )
          # Prefer curl, fallback to wget
          DOWNLOAD_CMD=""
          command -v curl >/dev/null 2>&1 && DOWNLOAD_CMD="curl -fsSL --connect-timeout 30 --max-time 300 -o"
          command -v wget >/dev/null 2>&1 && DOWNLOAD_CMD="wget -q -T 300 -O"
          if [ -z "$DOWNLOAD_CMD" ]; then
            echo "Error: neither curl nor wget available"
            exit 1
          fi
          for MIRROR in "${MIRRORS[@]}"; do
            echo "Downloading from $MIRROR ..."
            if $DOWNLOAD_CMD "/tmp/${GO_TARBALL}" "$MIRROR"; then
              break
            fi
            echo "Mirror failed: $MIRROR"
          done
          if [ -f "/tmp/${GO_TARBALL}" ]; then
            tar -C /usr/local -xzf "/tmp/${GO_TARBALL}"
            echo "/usr/local/go/bin" >> $GITHUB_PATH
            export PATH="/usr/local/go/bin:$PATH"
            go version
            go env -w GOPROXY=${GOPROXY}
          else
            echo "Error: Failed to download Go from all mirrors"
            exit 1
          fi

      - name: Run tests
        run: |
          GOTOOLCHAIN=local go test -C base_core ./...
          GOTOOLCHAIN=local go test -C base_tunnel ./...
          GOTOOLCHAIN=local go test -C daemon ./...

  build:
    needs: test
    runs-on: go-linux
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Unix-like platforms (Go 1.24.12) ---
          - goos: linux
            goarch: amd64
            label: linux-amd64
            go_version: "1.24.12"
          - goos: linux
            goarch: arm64
            label: linux-arm64
            go_version: "1.24.12"
          - goos: darwin
            goarch: amd64
            label: darwin-amd64
            go_version: "1.24.12"
          - goos: darwin
            goarch: arm64
            label: darwin-arm64
            go_version: "1.24.12"
          - goos: freebsd
            goarch: amd64
            label: freebsd-amd64
            go_version: "1.24.12"
          - goos: freebsd
            goarch: 386
            label: freebsd-386
            go_version: "1.24.12"
          - goos: freebsd
            goarch: arm64
            label: freebsd-arm64
            go_version: "1.24.12"
          # --- Windows (Go 1.24.12) ---
          - goos: windows
            goarch: amd64
            label: windows-amd64
            go_version: "1.24.12"
          - goos: windows
            goarch: 386
            label: windows-386
            go_version: "1.24.12"
          - goos: windows
            goarch: arm64
            label: windows-arm64
            go_version: "1.24.12"
          # --- Windows Legacy (Go 1.20.14, compatible with Win7/Server 2008) ---
          - goos: windows
            goarch: amd64
            label: windows-amd64-legacy
            go_version: "1.20.14"
          - goos: windows
            goarch: 386
            label: windows-386-legacy
            go_version: "1.20.14"

    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 "http://x-access-token:${{ secrets.GTEA_TOKEN }}@192.168.2.27/${GITHUB_REPOSITORY}.git" .
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            git fetch --depth 1 origin tag "${TAG}"
            git checkout "${TAG}"
          fi

      - name: Setup Go
        env:
          GO_VER: ${{ matrix.go_version }}
        run: |
          # Alpine 容器缺少 glibc 动态链接器，Go 官方二进制无法执行
          # 安装 libc6-compat 提供 /lib64/ld-linux-x86-64.so.2
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache libc6-compat 2>/dev/null || true
          fi
          # Ensure curl is available (some self-hosted runners lack it)
          if ! command -v curl >/dev/null 2>&1; then
            echo "curl not found, trying to install..."
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq curl
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache curl
            elif command -v yum >/dev/null 2>&1; then
              yum install -y -q curl
            fi
          fi
          # Check if the required Go version is already installed
          # Handle case where Go binary exists but is broken (container mismatch)
          NEED_INSTALL=true
          if [ -x /usr/local/go/bin/go ]; then
            INSTALLED_VERSION=$(/usr/local/go/bin/go version 2>/dev/null | awk '{print $3}' | sed 's/go//') || true
            if [ -n "${INSTALLED_VERSION}" ] && [ "${INSTALLED_VERSION}" = "${GO_VER}" ]; then
              export PATH="/usr/local/go/bin:$PATH"
              echo "/usr/local/go/bin" >> $GITHUB_PATH
              echo "Go ${GO_VER} already installed"
              go version
              go env -w GOPROXY=${GOPROXY}
              exit 0
            elif [ -n "${INSTALLED_VERSION}" ]; then
              echo "Go ${INSTALLED_VERSION} installed but need ${GO_VER}, replacing..."
            else
              echo "Go binary exists but cannot execute, replacing..."
            fi
            rm -rf /usr/local/go
          fi
          DOWNLOAD_CMD=""
          command -v curl >/dev/null 2>&1 && DOWNLOAD_CMD="curl -fsSL --connect-timeout 30 --max-time 300 -o"
          command -v wget >/dev/null 2>&1 && DOWNLOAD_CMD="wget -q -T 300 -O"
          if [ -z "$DOWNLOAD_CMD" ]; then
            echo "Error: neither curl nor wget available"
            exit 1
          fi
          GO_TARBALL="go${GO_VER}.linux-amd64.tar.gz"
          MIRRORS=(
            "http://192.168.2.36/${GO_TARBALL}"
            "https://golang.google.cn/dl/${GO_TARBALL}"
          )
          for MIRROR in "${MIRRORS[@]}"; do
            echo "Downloading from $MIRROR ..."
            if $DOWNLOAD_CMD "/tmp/${GO_TARBALL}" "$MIRROR"; then
              break
            fi
            echo "Mirror failed: $MIRROR"
          done
          if [ -f "/tmp/${GO_TARBALL}" ]; then
            tar -C /usr/local -xzf "/tmp/${GO_TARBALL}"
            echo "/usr/local/go/bin" >> $GITHUB_PATH
            export PATH="/usr/local/go/bin:$PATH"
          else
            echo "Error: Failed to download Go from all mirrors"
            exit 1
          fi
          go version
          go env -w GOPROXY=${GOPROXY}

      - name: Get version info
        id: version
        env:
          GOTOOLCHAIN: local
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT_ID: ${{ steps.version.outputs.COMMIT_ID }}
          LABEL: ${{ matrix.label }}
        run: |
          OUTPUT="nssh_${GOOS}_${GOARCH}"
          BUILD_TAGS=""
          BUILD_FLAGS=""
          if [ "${GOOS}" = "windows" ]; then
            OUTPUT="${OUTPUT}.exe"
            BUILD_TAGS="-tags netgo,osusergo"
            BUILD_FLAGS="-buildmode=exe"
          fi
          go build ${BUILD_TAGS} -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitID=${COMMIT_ID}" \
            -trimpath ${BUILD_FLAGS} -o "${OUTPUT}" .

      - name: Upload to MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: "nssh-opensource"
          VERSION: ${{ steps.version.outputs.VERSION }}
          LABEL: ${{ matrix.label }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -z "${MINIO_ENDPOINT}" ] || [ -z "${MINIO_ACCESS_KEY}" ]; then
            echo "MinIO not configured, skipping upload"
            exit 0
          fi

          SOURCE="nssh_${GOOS}_${GOARCH}"
          [ "${GOOS}" = "windows" ] && SOURCE="${SOURCE}.exe"

          if [ ! -f "${SOURCE}" ]; then
            echo "Binary ${SOURCE} not found, skipping"
            exit 0
          fi

          if ! command -v mc >/dev/null 2>&1; then
            echo "Installing mc client..."
            if command -v curl >/dev/null 2>&1; then
              curl -sL "http://dl.minio.org.cn/client/mc/release/linux-amd64/mc" -o /tmp/mc
            else
              wget -q -T 60 "http://dl.minio.org.cn/client/mc/release/linux-amd64/mc" -O /tmp/mc
            fi
            chmod +x /tmp/mc
            export PATH="/tmp:$PATH"
          fi

          mc alias set minio "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
          mc mb "minio/${MINIO_BUCKET}" 2>&1 || true

          FILENAME="nssh-opensource-v${VERSION}-${LABEL}"
          [ "${GOOS}" = "windows" ] && FILENAME="${FILENAME}.exe"
          TARGET_PATH="nssh-v${VERSION}/${LABEL}/${FILENAME}"
          mc cp "${SOURCE}" "minio/${MINIO_BUCKET}/${TARGET_PATH}"
          echo "Uploaded ${FILENAME} to MinIO: ${MINIO_BUCKET}/${TARGET_PATH}"

      - name: Archive artifacts
        run: |
          mkdir -p /tmp/artifacts
          cp nssh_* /tmp/artifacts/
          tar czf artifacts-${{ matrix.label }}.tar.gz \
            -C /tmp/artifacts .
