name: Debug Harbor Connectivity

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: go-linux
    timeout-minutes: 10
    steps:
      - name: Host netns diagnostics v3
        run: |
          set +e
          echo "=== docker ps ==="
          docker ps --format '{{.ID}} {{.Names}} {{.Image}} {{.Ports}}'
          echo "=== runner container inspect ==="
          RID=$(hostname)
          docker inspect "$RID" --format '{{.HostConfig.Privileged}} {{.HostConfig.NetworkMode}} {{.HostConfig.PidMode}} {{.Mounts}}' 2>/dev/null | head -5
          echo "=== find act alpine rootfs ==="
          ROOTFS=$(ls -d /root/.cache/act/*/hostexecutor/build/*/rootfs 2>/dev/null | head -1)
          echo "rootfs: $ROOTFS"
          echo "=== import local alpine image (no pull) ==="
          if [ -n "$ROOTFS" ]; then
            tar cf - -C "$ROOTFS" . 2>/dev/null | docker import - ci-alpine:v3 2>&1 | tail -1
          fi
          IMG=""
          for CAND in ci-alpine:v3 $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>'); do
            if docker run --rm "$CAND" /bin/sh -c 'true' >/dev/null 2>&1 || docker run --rm "$CAND" sh -c 'true' >/dev/null 2>&1; then
              IMG="$CAND"; break
            fi
          done
          echo "shell-capable image: $IMG"
          if [ -z "$IMG" ]; then echo "NO SHELL IMAGE AVAILABLE"; exit 0; fi
          echo "=== HOST netns: busybox wget test (key test) ==="
          docker run --rm --net host "$IMG" sh -c '
            wget -S -T 10 --no-check-certificate -O /dev/null https://192.168.2.88/v2/ 2>&1 | head -15
            echo "wget exit=$?"
          ' 2>&1 || echo "docker run failed exit=$?"
          echo "=== HOST netns: chroot diag with host tools ==="
          cat > /tmp/hostdiag.sh <<'EOS'
          echo "--- hostname ---"
          hostname
          echo "--- curl harbor (host tools, host netns) ---"
          curl -sk -m 10 -D - -o /dev/null https://192.168.2.88/v2/ ; echo "curl exit=$?"
          echo "--- curl verbose ---"
          curl -skv -m 10 -o /dev/null https://192.168.2.88/v2/ 2>&1 | grep -iE 'Connected|subject:|issuer:|HTTP/|SSL conn' || true
          echo "--- ip rule ---"
          ip rule 2>/dev/null || true
          echo "--- ip route ---"
          ip route 2>/dev/null || true
          echo "--- iptables nat ---"
          iptables -t nat -S 2>/dev/null | head -120 || true
          echo "--- iptables rules of interest ---"
          iptables-save 2>/dev/null | grep -iE '443|7890|redirect|tproxy' | head -40 || true
          echo "--- nft rules of interest ---"
          nft list ruleset 2>/dev/null | grep -iE '443|7890|redirect|tproxy' | head -40 || true
          echo "--- dockerd env proxy ---"
          PID=$(pidof dockerd 2>/dev/null); echo "pid=$PID"
          [ -n "$PID" ] && tr '\0' '\n' < /proc/$PID/environ | grep -iE 'proxy' || echo "(no proxy env)"
          echo "--- systemd docker overrides ---"
          ls -la /etc/systemd/system/docker.service.d/ 2>/dev/null || echo "(no override dir)"
          cat /etc/systemd/system/docker.service.d/*.conf 2>/dev/null || true
          EOS
          docker run --rm --net host --pid host --privileged -v /:/hostfs:ro -v /tmp/hostdiag.sh:/hostdiag.sh:ro "$IMG" \
            sh -c 'chroot /hostfs /bin/bash < /hostdiag.sh 2>&1 || chroot /hostfs /bin/sh < /hostdiag.sh 2>&1 || echo "CHROOT FAILED"' \
            2>&1 || echo "docker run failed exit=$?"
          echo "=== done ==="
