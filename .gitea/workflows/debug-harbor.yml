name: Debug Harbor Connectivity

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: go-linux
    timeout-minutes: 10
    steps:
      - name: Host network diagnostics
        run: |
          set +e
          echo "=== host ==="
          hostname; uname -a
          echo "=== container route ==="
          ip route get 192.168.2.88 2>/dev/null
          echo "=== job proxy env ==="
          env | grep -iE 'proxy' || echo "(no proxy env in job)"
          echo "=== docker images ==="
          docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | head -20
          echo "=== container-side curl https ==="
          curl -sk -m 15 -D - -o /dev/null https://192.168.2.88/v2/ ; echo "curl exit=$?"
          echo "=== container-side curl verbose ==="
          curl -skv -m 15 -o /dev/null https://192.168.2.88/v2/ 2>&1 | grep -iE 'Connected|subject:|issuer:|HTTP/|SSL conn' || true
          echo "=== HOST netns diagnostics (docker run --net host) ==="
          docker run --rm --net host --pid host --privileged -v /:/hostfs:ro alpine:3 sh -c '
            apk add --no-cache iptables curl >/dev/null 2>&1
            echo "--- dockerd env ---"
            PID=$(pidof dockerd 2>/dev/null); echo "dockerd pid=$PID"
            [ -n "$PID" ] && tr "\0" "\n" < /proc/$PID/environ | grep -iE "proxy" || echo "(no proxy in dockerd env)"
            echo "--- host iptables nat ---"
            iptables -t nat -S 2>/dev/null | head -100
            echo "--- rules mentioning 443/7890/redirect/tproxy ---"
            iptables-save 2>/dev/null | grep -iE "443|7890|redirect|tproxy" | head -40
            nft list ruleset 2>/dev/null | grep -iE "443|7890|redirect|tproxy" | head -40
            echo "--- host curl https /v2/ ---"
            curl -sk -m 15 -D - -o /dev/null https://192.168.2.88/v2/ ; echo "curl exit=$?"
            echo "--- host curl verbose ---"
            curl -skv -m 15 -o /dev/null https://192.168.2.88/v2/ 2>&1 | grep -iE "Connected|subject:|issuer:|HTTP/|SSL conn" || true
            echo "--- host /etc/hosts ---"
            cat /hostfs/etc/hosts 2>/dev/null | tail -10
            echo "--- host systemd docker overrides ---"
            ls -la /hostfs/etc/systemd/system/docker.service.d/ 2>/dev/null || echo "(no override dir)"
            cat /hostfs/etc/systemd/system/docker.service.d/*.conf 2>/dev/null
          ' 2>&1 || echo "docker run failed exit=$?"
          echo "=== done ==="
