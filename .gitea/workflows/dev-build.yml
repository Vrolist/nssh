name: Dev Build (main push)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GOPROXY: "https://goproxy.cn,direct"
  MINIO_BUCKET: "nssh-opensource"

# 快速连续 push 时取消尚未完成的旧 dev 构建，只保留最新一次
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: go-linux
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # 平台矩阵与 release-standard.yml 保持一致
          # --- Unix-like platforms (Go 1.24.12) ---
          - goos: linux
            goarch: amd64
            label: linux-amd64
            go_version: "1.24.12"
          - goos: linux
            goarch: arm64
            label: linux-arm64
            go_version: "1.24.12"
          - goos: darwin
            goarch: amd64
            label: darwin-amd64
            go_version: "1.24.12"
          - goos: darwin
            goarch: arm64
            label: darwin-arm64
            go_version: "1.24.12"
          - goos: freebsd
            goarch: amd64
            label: freebsd-amd64
            go_version: "1.24.12"
          - goos: freebsd
            goarch: 386
            label: freebsd-386
            go_version: "1.24.12"
          - goos: freebsd
            goarch: arm64
            label: freebsd-arm64
            go_version: "1.24.12"
          # --- Windows (Go 1.24.12) ---
          - goos: windows
            goarch: amd64
            label: windows-amd64
            go_version: "1.24.12"
          - goos: windows
            goarch: 386
            label: windows-386
            go_version: "1.24.12"
          - goos: windows
            goarch: arm64
            label: windows-arm64
            go_version: "1.24.12"
          # --- Windows Legacy (Go 1.20.14, compatible with Win7/Server 2008) ---
          - goos: windows
            goarch: amd64
            label: windows-amd64-legacy
            go_version: "1.20.14"
          - goos: windows
            goarch: 386
            label: windows-386-legacy
            go_version: "1.20.14"

    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 "http://x-access-token:${{ secrets.GTEA_TOKEN }}@192.168.2.27/${GITHUB_REPOSITORY}.git" .

      - name: Setup Go
        env:
          GO_VER: ${{ matrix.go_version }}
        run: |
          # 全程内网：Go 包只走 192.168.2.36 本地镜像，不访问公网
          # Ensure curl is available (some self-hosted runners lack it)
          if ! command -v curl >/dev/null 2>&1; then
            echo "curl not found, trying to install..."
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq curl
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache curl
            elif command -v yum >/dev/null 2>&1; then
              yum install -y -q curl
            fi
          fi
          # Check if the required Go version is already installed
          # Handle case where Go binary exists but is broken (container mismatch)
          NEED_INSTALL=true
          if [ -x /usr/local/go/bin/go ]; then
            INSTALLED_VERSION=$(/usr/local/go/bin/go version 2>/dev/null | awk '{print $3}' | sed 's/go//') || true
            if [ -n "${INSTALLED_VERSION}" ] && [ "${INSTALLED_VERSION}" = "${GO_VER}" ]; then
              export PATH="/usr/local/go/bin:$PATH"
              echo "/usr/local/go/bin" >> $GITHUB_PATH
              echo "Go ${GO_VER} already installed"
              go version
              go env -w GOPROXY=${GOPROXY}
              exit 0
            elif [ -n "${INSTALLED_VERSION}" ]; then
              echo "Go ${INSTALLED_VERSION} installed but need ${GO_VER}, replacing..."
            else
              echo "Go binary exists but cannot execute, replacing..."
            fi
            rm -rf /usr/local/go
          fi
          DOWNLOAD_CMD=""
          command -v curl >/dev/null 2>&1 && DOWNLOAD_CMD="curl -fsSL --connect-timeout 30 --max-time 300 -o"
          command -v wget >/dev/null 2>&1 && DOWNLOAD_CMD="wget -q -T 300 -O"
          if [ -z "$DOWNLOAD_CMD" ]; then
            echo "Error: neither curl nor wget available"
            exit 1
          fi
          GO_TARBALL="go${GO_VER}.linux-amd64.tar.gz"
          # 只走内网镜像（192.168.2.36 已托管 go1.20.14 / go1.24.12），不走公网
          MIRRORS=(
            "http://192.168.2.36/${GO_TARBALL}"
          )
          for MIRROR in "${MIRRORS[@]}"; do
            echo "Downloading from $MIRROR ..."
            if $DOWNLOAD_CMD "/tmp/${GO_TARBALL}" "$MIRROR"; then
              break
            fi
            echo "Mirror failed: $MIRROR"
          done
          if [ -f "/tmp/${GO_TARBALL}" ]; then
            tar -C /usr/local -xzf "/tmp/${GO_TARBALL}"
            echo "/usr/local/go/bin" >> $GITHUB_PATH
            export PATH="/usr/local/go/bin:$PATH"
            # Alpine 无 glibc 动态链接器：仅当 Go 二进制确实跑不动时才补装
            # libc6-compat（正常 runner 不触发，避免每次构建都访问公网 apk 源）
            if ! go version 2>/dev/null | grep -q "go${GO_VER}"; then
              echo "go binary failed to run, installing libc6-compat ..."
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache libc6-compat || true
              fi
              go version || { echo "Error: go still not runnable after libc6-compat"; exit 1; }
            fi
            go env -w GOPROXY=${GOPROXY}
          else
            echo "Error: Failed to download Go from local mirror 192.168.2.36"
            exit 1
          fi

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          COMMIT_ID=$(git rev-parse --short HEAD)
          BUILD_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d_%H:%M:%S')

          # 开发版版本号：dev-{日期}-{commit}（与 nssh-agent 约定一致）
          VERSION="dev-$(TZ='Asia/Shanghai' date +%Y%m%d)-${COMMIT_ID}"

          OUTPUT="nssh_${GOOS}_${GOARCH}"
          BUILD_TAGS=""
          BUILD_FLAGS=""
          if [ "${GOOS}" = "windows" ]; then
            OUTPUT="${OUTPUT}.exe"
            BUILD_TAGS="-tags netgo,osusergo"
            BUILD_FLAGS="-buildmode=exe"
          fi
          go build ${BUILD_TAGS} -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.CommitID=${COMMIT_ID}" \
            -trimpath ${BUILD_FLAGS} -o "${OUTPUT}" .
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_OUTPUT
          echo "构建完成: ${OUTPUT} (版本 ${VERSION})"

      - name: Upload to MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ steps.build.outputs.VERSION }}
          LABEL: ${{ matrix.label }}
          OUTPUT: ${{ steps.build.outputs.OUTPUT }}
        run: |
          if [ -z "${MINIO_ENDPOINT}" ] || [ -z "${MINIO_ACCESS_KEY}" ]; then
            echo "MinIO not configured, skipping upload"
            exit 0
          fi

          if [ ! -f "${OUTPUT}" ]; then
            echo "Binary ${OUTPUT} not found, skipping"
            exit 0
          fi

          if ! command -v mc >/dev/null 2>&1; then
            echo "Installing mc client..."
            if command -v curl >/dev/null 2>&1; then
              curl -sL "http://dl.minio.org.cn/client/mc/release/linux-amd64/mc" -o /tmp/mc
            else
              wget -q -T 60 "http://dl.minio.org.cn/client/mc/release/linux-amd64/mc" -O /tmp/mc
            fi
            chmod +x /tmp/mc
            export PATH="/tmp:$PATH"
          fi

          mc alias set minio "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
          mc mb "minio/${MINIO_BUCKET}" 2>&1 || true

          # 路径约定（Web 端扫描按 version_prefix='nssh-v' 解析）：
          #   nssh-vdev-{日期}-{commit}/{label}/nssh-opensource-dev-{日期}-{commit}-{label}
          # → 页面版本号 dev-{日期}-{commit}，扫描入库即展示，仅供测试下载
          FILENAME="nssh-opensource-${VERSION}-${LABEL}"
          [ "${GOOS}" = "windows" ] && FILENAME="${FILENAME}.exe"
          TARGET_PATH="nssh-v${VERSION}/${LABEL}/${FILENAME}"
          mc cp "${OUTPUT}" "minio/${MINIO_BUCKET}/${TARGET_PATH}"
          echo "Uploaded ${FILENAME} to MinIO: ${MINIO_BUCKET}/${TARGET_PATH}"
