---
# Salsa CI: runs the official Debian packaging checks on every push.
# This mirrors the sbuild + lintian + pbuilder + autopkgtest checks done
# locally, but on Debian's own infrastructure.
# Documented at: https://salsa.debian.org/salsa-ci-team/pipeline/
include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/salsa-ci.yml
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/pipeline-jobs.yml

variables:
  SALSA_CI_DISABLE_APTLY: 1
  SALSA_CI_DISABLE_PIUPARTS: 1