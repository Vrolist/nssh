name: Release Standard Platforms

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.12'

      - name: Run tests
        run: |
          GOTOOLCHAIN=local go test -C base_core ./...
          GOTOOLCHAIN=local go test -C base_tunnel ./...
          GOTOOLCHAIN=local go test -C daemon ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            label: linux-amd64
          - goos: linux
            goarch: arm64
            label: linux-arm64
          - goos: darwin
            goarch: amd64
            label: darwin-amd64
          - goos: darwin
            goarch: arm64
            label: darwin-arm64
          - goos: freebsd
            goarch: amd64
            label: freebsd-amd64
          - goos: freebsd
            goarch: 386
            label: freebsd-386
          - goos: freebsd
            goarch: arm64
            label: freebsd-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.12'

      - name: Get version info
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT_ID: ${{ steps.version.outputs.COMMIT_ID }}
        run: |
          OUTPUT="nssh_${GOOS}_${GOARCH}"
          [ "${GOOS}" = "windows" ] && OUTPUT="${OUTPUT}.exe"
          go build -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitID=${COMMIT_ID}" \
            -trimpath -o "${OUTPUT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nssh-${{ matrix.label }}
          path: nssh_*

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.12'

      - name: Get version info
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build binaries for npm (5 platforms)
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT_ID: ${{ steps.version.outputs.COMMIT_ID }}
        run: |
          set -e
          mkdir -p dist
          for p in "darwin:arm64" "darwin:amd64" "windows:amd64" "linux:amd64" "linux:arm64"; do
            GOOS="${p%%:*}"
            GOARCH="${p##*:}"
            OUTPUT="dist/nssh_${GOOS}_${GOARCH}"
            [ "${GOOS}" = "windows" ] && OUTPUT="${OUTPUT}.exe"
            GOOS="${GOOS}" GOARCH="${GOARCH}" go build \
              -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitID=${COMMIT_ID}" \
              -trimpath -o "${OUTPUT}" .
          done
          ls -lh dist/

      - name: Publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -e
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN not configured, skipping npm publish"
            exit 0
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "npm not found on runner, skipping npm publish"
            exit 0
          fi
          export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP:-/tmp}/npmrc"
          export NPM_CONFIG_CACHE="${RUNNER_TEMP:-/tmp}/npm-cache"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${NPM_CONFIG_USERCONFIG}"
          chmod 600 "${NPM_CONFIG_USERCONFIG}"
          ./npm/publish.sh "${VERSION}"

  publish-python:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.12'

      - name: Get version info
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build binaries for Python (5 platforms)
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT_ID: ${{ steps.version.outputs.COMMIT_ID }}
        run: |
          set -e
          mkdir -p dist
          for p in "darwin:arm64" "darwin:amd64" "windows:amd64" "linux:amd64" "linux:arm64"; do
            GOOS="${p%%:*}"
            GOARCH="${p##*:}"
            OUTPUT="dist/nssh_${GOOS}_${GOARCH}"
            [ "${GOOS}" = "windows" ] && OUTPUT="${OUTPUT}.exe"
            GOOS="${GOOS}" GOARCH="${GOARCH}" go build \
              -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitID=${COMMIT_ID}" \
              -trimpath -o "${OUTPUT}" .
          done
          ls -lh dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          pip install --quiet build twine

      - name: Publish Python packages
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -e
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "PYPI_TOKEN not configured, skipping python publish"
            exit 0
          fi
          chmod +x python/python_publish.sh
          ./python/python_publish.sh "${VERSION}"
